services:
  postgres:
    image: postgres:17
    container_name: relayforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge_dev
      POSTGRES_DB: relayforge

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge -d relayforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
